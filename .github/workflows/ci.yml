name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vega-plugin-haneoka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Haneoka plugin
        uses: actions/checkout@v7
        with:
          path: vega-plugin-haneoka

      - name: Check out Vega
        uses: actions/checkout@v7
        with:
          repository: haneoka-gakuen/vega
          path: vega-plugin-haneoka/.dependencies/vega

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vega-plugin-haneoka/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vega-plugin-haneoka
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: vega-plugin-haneoka
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Vega
        working-directory: vega-plugin-haneoka
        run: pnpm --filter @haneoka/vega build:core

      - name: Check package
        working-directory: vega-plugin-haneoka
        run: pnpm check

      - name: Inspect package contents
        working-directory: vega-plugin-haneoka
        run: pnpm pack --dry-run
